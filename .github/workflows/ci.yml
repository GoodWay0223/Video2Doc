name: Cross-platform CI

"on":
  push:
  pull_request:
  workflow_dispatch:
  # Reinstall the unconstrained latest stable yt-dlp and rerun both platforms weekly.
  schedule:
    - cron: "17 18 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
        python-version:
          - "3.10"
          - "3.12"
          - "3.14"

    env:
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q webui.py video2doc.py webui scripts tests

      - name: Run core regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Smoke-test CLI
        run: python video2doc.py --help

      - name: Smoke-test Windows launcher
        if: runner.os == 'Windows'
        shell: cmd
        run: start-video2doc.cmd --help

      - name: Smoke-test macOS launchers
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash -n start-video2doc.command video2doc.sh scripts/*.sh
          test -x start-video2doc.command
          ./start-video2doc.command --help

      - name: Build cross-platform release archive
        run: python scripts/build_release.py --version 0.0.0-ci --output-dir dist

      - name: Upload package smoke-test artifact
        uses: actions/upload-artifact@v7
        with:
          name: Video2Doc-0.0.0-ci-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
